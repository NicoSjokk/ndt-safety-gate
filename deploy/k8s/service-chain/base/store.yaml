# Placeholder: http-echo stands in for the real function until the chain is
# wired up (frontend -> processor -> store). Requests match examples/cluster-state.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  labels:
    app.kubernetes.io/name: store
    app.kubernetes.io/part-of: service-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store
        app.kubernetes.io/part-of: service-chain
    spec:
      containers:
        - name: store
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=store ok (next hop: none)"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: store
  labels:
    app.kubernetes.io/name: store
    app.kubernetes.io/part-of: service-chain
spec:
  selector:
    app.kubernetes.io/name: store
  ports:
    - name: http
      port: 80
      targetPort: http
